[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
markers =
    live_integration: marks tests as requiring external live network access
filterwarnings =
    ignore:.*'asyncio.iscoroutinefunction' is deprecated.*:DeprecationWarning:langsmith.*
    ignore:.*[Pp]ayload indexes have no effect in the local Qdrant.*:UserWarning
